
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #181818;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: min(100vw, 133.333vh);
            height: min(75vw, 100vh);
            aspect-ratio: 4 / 3;
            border: none;
            outline: none;
        }
    </style>
</head>

<body>
    <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1">
    </canvas>

    <script>
        var Module = {
            canvas: document.getElementById("canvas"),

            print: function(text) {
                console.log(text);
            },

            printErr: function(text) {
                console.error(text);
            }
        };
    </script>

    <script async type="text/javascript" src="UNO.js"></script>
</body>
</html>
